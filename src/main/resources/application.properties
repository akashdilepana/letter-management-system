spring.application.name=letter-management-system

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Recompile JSPs when their source files change during development.
server.servlet.jsp.init-parameters.development=true

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/letter_management
spring.datasource.username=root
spring.datasource.password=1234

# Server Configuration
server.port=8080

# Uploaded letter files are stored here, relative to the application working directory.
app.letter-upload-dir=uploads/letters
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=40MB
